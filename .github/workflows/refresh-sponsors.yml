name: Refresh IND sponsor job boards

on:
  schedule:
    - cron: "17 3 1 * *"   # 1st of every month, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the IND register for job boards
        run: python discover_boards.py --workers 48
      - name: Save results
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add boards.json ind_sponsors.json
          git diff --cached --quiet || git commit -m "Refresh IND sponsor job boards"
          git pull --rebase
          git push
